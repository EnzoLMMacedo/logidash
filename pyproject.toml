[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logidash"
version = "0.1.0"
description = "Motor de KPI logístico do LogiDash"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "fastapi>=0.115",
  "numpy>=2",
  "pyarrow>=18",
  "pyyaml>=6",
  "sqlglot>=26",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"logidash.metrics" = ["definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
